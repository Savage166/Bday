<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Priya!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #a8edea);
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        header {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3em;
            color: #e91e63;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .cake {
            width: 200px;
            height: 150px;
            background: url('https://via.placeholder.com/200x150/ffb3ba/ffffff?text=Cake') no-repeat center;
            background-size: cover;
            margin: 20px auto;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .balloons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background: radial-gradient(circle, #ff6b9d, #c44569);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 6s infinite ease-in-out;
        }
        .balloon:nth-child(1) { left: 10%; animation-delay: 0s; }
        .balloon:nth-child(2) { left: 20%; animation-delay: 1s; background: radial-gradient(circle, #a8e6cf, #52c234); }
        .balloon:nth-child(3) { left: 70%; animation-delay: 2s; background: radial-gradient(circle, #ffd3a5, #ff8a65); }
        .balloon:nth-child(4) { left: 80%; animation-delay: 3s; }
        @keyframes float {
            0% { transform: translateY(100vh); }
            100% { transform: translateY(-100px); }
        }
        .details {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .details h2 {
            color: #e91e63;
            font-family: 'Dancing Script', cursive;
        }
        .rsvp {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #c2185b;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            .cake { width: 150px; height: 112px; }
        }
    </style>
</head>
<body>
    <div class="balloons">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>
    <div class="container">
        <header>
            <h1>Happy Birthday, Priya Banerjee!</h1>
            <div class="cake"></div>
        </header>
        <section class="details">
            <h2>You're Invited!</h2>
            <p>Join us for a magical celebration of Priya's special day.</p>
            <p><strong>Date:</strong>November 15, 2025</p>
            <p><strong>Time:</strong>2:00 PM</p>
            <p><strong>Venue:</strong>Priya home </p>
            <p>Dress in your favorite pastel colors and bring lots of smiles!</p>
        </section>
        <section class="rsvp">
            <h2>Tell Us !!</h2>
            <p>Please let us know if you can make it!</p>
            <form action="#" method="post">
                <label for="name">Name:</label><br>
               
                <input type="email" id="email" name="email" required><br><br>
                <label for="attending">Will you attend?</label><br>
                <select id="attending" name="attending">
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select><br><br>
                <button type="submit">Submit RSVP</button>
            </form>
        </section>
    </div>
    <script>
        // Simple JS for form submission (placeholder - replace with real backend)
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for RSVPing! We\'ll see you there.');
        });
    </script>
</body>
</html>
